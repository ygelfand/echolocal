name: release

on:
  push:
    tags: ["[0-9]*", "!*_local"]

permissions:
  contents: write

env:
  GOWORK: "off"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        id: go
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-check-
          restore-keys: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-check-

      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-show-crown-
          restore-keys: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-show-crown-

      - name: upx version
        id: upx
        run: echo "version=$(sed -n 's/^UPX_VERSION := //p' Makefile)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6
        with:
          path: bin/upx-${{ steps.upx.outputs.version }}/build/upx
          key: upx-${{ runner.os }}-${{ steps.upx.outputs.version }}

      - name: install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: build upx
        run: make upx

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          VERSION: ${{ github.ref_name }}
          PACK: bin/upx-${{ steps.upx.outputs.version }}/build/upx --lzma -2
