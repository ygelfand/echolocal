name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  GOWORK: "off"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        id: go
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-check-${{ github.run_id }}
          restore-keys: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-check-

      - name: upx version
        id: upx
        run: echo "version=$(sed -n 's/^UPX_VERSION := //p' Makefile)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: bin/upx-${{ steps.upx.outputs.version }}/build/upx
          key: upx-${{ runner.os }}-${{ steps.upx.outputs.version }}

      - name: build upx
        run: make upx

      - name: vet
        run: make vet

      - name: test
        run: make test

      # The race detector needs cgo.
      - name: test -race
        run: make test-race
        env:
          CGO_ENABLED: 1

      - name: cross-compile biscuit without native tools
        run: |
          make build-echod DOT_ARCH=arm NDK=/nonexistent
          make build-echod DOT_ARCH=arm64 NDK=/nonexistent

      - name: build without the assembly
        run: make build-echod TAGS=noasm

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true

      - name: format check
        run: golangci-lint fmt --diff

      - name: lint
        run: golangci-lint run

      - name: lint biscuit
        run: golangci-lint run --build-tags board_biscuit

  show:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [checkers, cronos, crown]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-show-${{ matrix.board }}-${{ github.run_id }}
          restore-keys: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-show-${{ matrix.board }}-
      - name: install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: build Show with its native payload
        run: make build-echod BOARD=${{ matrix.board }}
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      - name: lint with the board tag
        run: golangci-lint run --build-tags board_${{ matrix.board }},payload
      - name: native wire checks
        if: matrix.board == 'checkers'
        run: make test-surface
