version: "2"

run:
  timeout: 5m
  go: "1.27"
formatters:
  enable:
    - gofmt
    - goimports
    - golines
  settings:
    goimports:
      local-prefixes:
        - github.com/ygelfand/echolocal
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (net.Conn).Close
        - (*os.File).Close
        - (*github.com/ygelfand/go-esphome-device/mdns.Advertiser).Close
        - (*github.com/ygelfand/echolocal/internal/input.Device).Close
        - (*github.com/ygelfand/echolocal/internal/alsa.Mixer).Close
        - (*github.com/ygelfand/echolocal/internal/alsa.Playback).Close
        - (*github.com/ygelfand/echolocal/internal/speaker.Player).Close
        - (*github.com/ygelfand/echolocal/internal/mic.Source).Close
        - (*github.com/ygelfand/echolocal/internal/alog.Handler).Close
        - fmt.Fprintf
        - fmt.Fprintln

  exclusions:
    rules:
      - linters: [errcheck]
        source: "^\\s*defer "

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
